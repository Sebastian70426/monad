<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Monad</title>
<script src="/eel.js"></script>
<script src="js/i18n.js"></script>
<link rel="stylesheet" href="css/design-system.css">
<style>
body{display:flex;flex-direction:column;height:100vh}

#titlebar{height:var(--titlebar-h);flex-shrink:0;background:linear-gradient(180deg,rgba(255,255,255,0.03) 0%,rgba(255,255,255,0) 100%),#0D0D0D;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;-webkit-app-region:drag}
#titlebar span{font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-tertiary);letter-spacing:0.2px}

#body-wrap{display:flex;flex:1;overflow:hidden}

#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:var(--space-3)}
#sidebar .logo{font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-primary);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);letter-spacing:-0.2px}
#sidebar .sec-label{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.6px;padding:var(--space-3) var(--space-3) var(--space-1)}
#sidebar .nav-item{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);height:34px;border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:var(--weight-regular);color:var(--text-secondary);cursor:pointer;transition:all var(--ease-fast);position:relative}
#sidebar .nav-item:hover{background:var(--bg-card);color:var(--text-primary)}
#sidebar .nav-item.active{background:var(--accent-muted);color:var(--text-primary);font-weight:var(--weight-medium)}
#sidebar .nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);animation:indIn 200ms cubic-bezier(0.16,1,0.3,1)}
@keyframes indIn{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
#sidebar .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.45}
#sidebar .nav-item:hover svg{opacity:0.70}
#sidebar .nav-item.active svg{opacity:1;color:var(--accent)}
#sidebar .nav-item.disabled{opacity:0.30;cursor:not-allowed;pointer-events:none}
#sidebar .user{margin-top:auto;padding:var(--space-3);font-size:var(--text-sm);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-2)}
#sidebar .user .avatar{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:11px}

#content-slot{flex:1;background:var(--bg-surface);padding:var(--space-8);overflow-y:auto;position:relative}
.page-view{animation:pgEnter 220ms cubic-bezier(0.16,1,0.3,1)}
.page-view.exiting{animation:pgExit 120ms cubic-bezier(0.4,0,1,1) forwards;pointer-events:none}
@keyframes pgEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pgExit{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}

#statusbar{height:var(--statusbar-h);flex-shrink:0;background:#0A0A0A;border-top:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-5);font-size:var(--text-xs);color:var(--text-tertiary)}
#statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

.page-title{font-size:var(--text-2xl);font-weight:var(--weight-bold);letter-spacing:-0.4px;margin-bottom:4px;color:var(--text-primary)}
.page-sub{font-size:var(--text-base);color:var(--text-secondary);font-weight:var(--weight-regular);margin-bottom:var(--space-8)}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer;margin-bottom:var(--space-4);transition:color var(--ease-fast)}
.back-link:hover{color:var(--text-primary)}.back-link svg{width:14px;height:14px}

.panel{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--space-5);transition:all var(--ease-normal)}
.panel-header{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-4)}

/* dashboard */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-bottom:var(--space-8)}
.quick-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-2xl);padding:var(--space-5);cursor:pointer;transition:all var(--ease-normal);display:flex;flex-direction:column;gap:var(--space-2)}
.quick-card:hover{background:var(--bg-card-hover);border-color:var(--border-visible);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.quick-card:active{transform:translateY(0);box-shadow:var(--shadow-xs);transition:all 80ms ease-in}
.quick-card svg{width:22px;height:22px;opacity:0.65;color:var(--accent)}
.quick-card .qc-title{font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--text-primary);letter-spacing:0.01em}
.quick-card .qc-desc{font-size:var(--text-sm);color:var(--text-tertiary);font-weight:var(--weight-regular);line-height:1.65}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-8)}
.course-row{padding:var(--space-2) 0;font-size:var(--text-sm);color:var(--text-secondary);display:flex;align-items:center;gap:var(--space-2);cursor:pointer;transition:color var(--ease-fast)}
.course-row:hover{color:var(--text-primary)}.course-row svg{width:14px;height:14px;opacity:0.50;flex-shrink:0}

/* empty state */
.empty-block{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-6) 0;text-align:center;gap:var(--space-2)}
.empty-block svg{width:28px;height:28px;opacity:0.18;color:var(--text-tertiary)}
.empty-block .eb-text{font-size:var(--text-sm);color:var(--text-tertiary);line-height:1.6;max-width:200px}

/* tabs */
.tabs{display:flex;gap:0;margin-bottom:var(--space-6);border-bottom:1px solid var(--border-subtle)}
.tab-item{padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary);cursor:pointer;position:relative;transition:color var(--ease-fast)}
.tab-item:hover{color:var(--text-primary)}.tab-item.active{color:var(--text-primary);font-weight:var(--weight-semibold)}
.tab-item.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);border-radius:1px}

/* lecture */
.lecture-list{display:flex;flex-direction:column;gap:var(--space-3)}
.lecture-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:all var(--ease-normal)}
.lecture-card:hover{background:var(--bg-card-hover);border-color:var(--border-visible);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.lecture-card .lc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lecture-card .lc-title{font-size:var(--text-base);font-weight:var(--weight-semibold);color:var(--text-primary)}
.lecture-card .lc-meta{font-size:var(--text-sm);color:var(--text-tertiary)}
.lc-badge{font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-full);font-weight:var(--weight-medium)}
.lc-badge-has-note{background:rgba(52,211,153,0.10);color:var(--green)}
.lc-badge-no-note{background:var(--bg-input);color:var(--text-tertiary)}

/* upload */
.step-label{font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary);margin-bottom:4px}
.upload-select{width:100%;height:36px;padding:0 var(--space-3);background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);outline:none;cursor:pointer;margin-bottom:var(--space-6);appearance:none}
.upload-select:focus{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.upload-zone{border:2px dashed rgba(255,255,255,0.10);border-radius:var(--radius-2xl);padding:48px;text-align:center;cursor:pointer;transition:all var(--ease-normal);margin-bottom:var(--space-6)}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-muted)}
.upload-zone svg{width:32px;height:32px;margin-bottom:var(--space-3);opacity:0.45;transition:all var(--ease-normal)}
.upload-zone:hover svg{opacity:0.75;transform:scale(1.05)}
.upload-zone .uz-text{font-size:var(--text-base);color:var(--text-secondary);font-weight:var(--weight-medium)}
.upload-zone .uz-hint{font-size:var(--text-sm);color:var(--text-tertiary);margin-top:4px}
.file-info-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--space-4);margin-bottom:var(--space-6);display:flex;justify-content:space-between;align-items:center}
.file-info-card .fi-name{font-size:var(--text-base);font-weight:var(--weight-medium);color:var(--text-primary)}
.file-info-card .fi-meta{font-size:var(--text-sm);color:var(--text-secondary);margin-top:2px}
.file-info-card .fi-remove{font-size:var(--text-sm);color:var(--text-tertiary);cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);transition:all var(--ease-fast)}
.file-info-card .fi-remove:hover{color:var(--red);background:rgba(248,113,113,0.08)}

/* buttons */
.btn{width:100%;height:40px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:var(--weight-semibold);cursor:pointer;transition:all var(--ease-fast)}
.btn:hover{background:var(--accent-hover);box-shadow:0 4px 12px var(--accent-glow)}
.btn:active{transform:scale(0.97);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
.btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:var(--bg-card);border:1px solid var(--border-default);color:var(--text-primary);height:36px;padding:0 var(--space-4);border-radius:var(--radius-sm);font-size:var(--text-sm);cursor:pointer;transition:all var(--ease-fast)}
.btn-secondary:hover{background:var(--bg-card-hover);border-color:var(--border-visible)}

/* progress */
.progress-section{margin-top:var(--space-6)}
.progress-bar{height:5px;background:var(--border-subtle);border-radius:3px;margin-bottom:var(--space-4);overflow:hidden}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width 400ms ease-out}
.progress-step{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;font-size:var(--text-sm)}
.progress-step .ps-icon{width:18px;text-align:center;flex-shrink:0}
.ps-done{color:var(--green)}.ps-active{color:var(--accent)}.ps-wait{color:var(--text-tertiary)}
.note-box{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--space-5);margin-top:var(--space-6);line-height:var(--leading-relaxed)}
.note-box h3{font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--space-4);color:var(--text-primary)}

/* settings */
.settings-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:var(--space-5);margin-bottom:var(--space-4)}
.settings-card .sc-title{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px}
.settings-field-label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--text-secondary);margin-bottom:6px}
.input-row{display:flex;gap:var(--space-2)}
.input-row input{flex:1;height:36px;padding:0 var(--space-3);background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);outline:none}
.input-row input:focus{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.btn-test{height:36px;padding:0 var(--space-4);background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer;transition:all var(--ease-fast)}
.btn-test:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.btn-save{width:100%;height:40px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:var(--weight-semibold);cursor:pointer;transition:all var(--ease-fast);margin-top:var(--space-2)}
.btn-save:hover{background:var(--accent-hover);box-shadow:0 4px 12px var(--accent-glow)}
.btn-save:active{transform:scale(0.97)}
.status-msg{font-size:var(--text-sm);margin-top:4px}.status-msg.ok{color:var(--green)}.status-msg.fail{color:var(--red)}
.lang-select{width:100%;height:36px;padding:0 var(--space-3);background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);outline:none;cursor:pointer;appearance:none}
.lang-select:focus{border-color:var(--accent);box-shadow:var(--shadow-glow)}

/* note */
.note-section{margin-bottom:var(--space-6)}
.note-section-title{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-3)}
.note-summary{background:var(--bg-card);border-left:3px solid var(--accent);border-radius:0 var(--radius-lg) var(--radius-lg) 0;padding:var(--space-4);line-height:var(--leading-relaxed);box-shadow:0 0 12px rgba(129,140,248,0.06)}
.note-concept-item{display:flex;gap:var(--space-2);padding:var(--space-2) 0;font-size:var(--text-base);line-height:var(--leading-relaxed);color:var(--text-secondary)}
.note-concept-item .nci-dot{color:var(--accent);flex-shrink:0;margin-top:2px}
.equation-block{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-primary);overflow-x:auto}
.equation-desc{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-3);padding-left:var(--space-2)}
.exam-item{padding:var(--space-2) 0;font-size:var(--text-base);display:flex;gap:var(--space-2);align-items:flex-start;color:var(--text-secondary)}
.term-table{width:100%;border-collapse:collapse}
.term-table td{padding:var(--space-2) var(--space-3);font-size:var(--text-sm);border-bottom:1px solid var(--border-subtle)}
.term-table td:first-child{font-weight:var(--weight-semibold);width:180px;color:var(--text-primary)}
.term-table td:last-child{color:var(--text-secondary)}
.transcript-collapsed{max-height:300px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--space-4);margin-top:var(--space-4);font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed)}
.action-bar{display:flex;gap:var(--space-2);margin-top:var(--space-6)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12) 0;text-align:center}
.empty-state svg{width:48px;height:48px;opacity:0.15;margin-bottom:var(--space-4)}
.empty-state .es-title{font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--text-primary);margin-bottom:4px}
.empty-state .es-desc{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-5)}
.placeholder-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12) 0;text-align:center;color:var(--text-tertiary)}
.placeholder-tab .pt-icon{font-size:32px;margin-bottom:var(--space-3);opacity:0.25}
.placeholder-tab .pt-text{font-size:var(--text-sm)}
</style>
</head>
<body>

<div id="titlebar"><span data-i18n="app.titlebar">AI 学习助手</span></div>

<div id="body-wrap">

<div id="sidebar">
  <div class="logo" data-i18n="sidebar.logo">AIStudyBuddy</div>
  <div class="sec-label" data-i18n="sidebar.sections.study">学习</div>
  <div class="nav-item active" data-page="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span data-i18n="sidebar.dashboard">仪表盘</span>
  </div>
  <div class="nav-item" data-page="courses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    <span data-i18n="sidebar.courses">课程</span>
  </div>
  <div class="nav-item" data-page="upload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    <span data-i18n="sidebar.lectureAnalysis">录音分析</span>
  </div>
  <div class="sec-label" data-i18n="sidebar.sections.ai">智能</div>
  <div class="nav-item disabled" data-page="tutor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span data-i18n="sidebar.aiTutor">AI Tutor</span>
  </div>
  <div class="nav-item disabled" data-page="knowledge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    <span data-i18n="sidebar.knowledgeBase">知识库</span>
  </div>
  <div class="sec-label" data-i18n="sidebar.sections.system">系统</div>
  <div class="nav-item" data-page="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span data-i18n="sidebar.settings">设置</span>
  </div>
  <div class="user"><div class="avatar">S</div><span data-i18n="sidebar.user">Sebastian</span></div>
</div>

<div id="content-slot"></div>

</div>

<div id="statusbar">
  <span style="display:flex;align-items:center;gap:6px"><span class="dot"></span><span data-i18n="statusbar.ready">模型就绪</span></span>
  <span data-i18n="statusbar.model">DeepSeek V4</span>
</div>

<!-- ═══════════════════════ TEMPLATES ═══════════════════════ -->

<template id="tpl-dashboard"><div class="page-view">
  <div class="page-title" id="dbGreeting">下午好，Sebastian</div>
  <div class="page-sub" id="dbSubtitle">今天有 2 门新课需要复习</div>
  <div class="quick-grid">
    <div class="quick-card" onclick="navigateTo('upload')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span class="qc-title" data-i18n="dashboard.quickActions.newRecording">新录音</span>
      <span class="qc-desc" data-i18n="dashboard.quickActions.newRecordingDesc">上传课堂录音</span>
    </div>
    <div class="quick-card" onclick="navigateTo('courses')">

<!-- ═══════════════════════ LOGIC ═══════════════════════ -->
<script>
var _currentPage = null;
var _pageParams = {};

function navigateTo(page, params) {
  params = params || {};
  if (page === _currentPage && Object.keys(params).length === 0) return;
  var slot = document.getElementById('content-slot');
  var tpl = document.getElementById('tpl-' + page);
  if (!tpl) return;
  _pageParams = params;
  var cv = slot.querySelector('.page-view');
  if (cv) { cv.classList.add('exiting'); setTimeout(function(){ slot.innerHTML = ''; mountPage(page, tpl); }, 100); }
  else { mountPage(page, tpl); }
}

function mountPage(page, tpl) {
  var slot = document.getElementById('content-slot'); slot.innerHTML = tpl.innerHTML;
  document.querySelectorAll('#sidebar .nav-item').forEach(function(el){ el.classList.remove('active'); });
  var ni = document.querySelector('#sidebar .nav-item[data-page="'+page+'"]'); if (ni) ni.classList.add('active');
  if (page === 'course-detail' || page === 'note') { var cn = document.querySelector('#sidebar .nav-item[data-page="courses"]'); if (cn) cn.classList.add('active'); }
  _currentPage = page;
  var initMap = {
    'dashboard': initDashboard, 'courses': initCourses, 'course-detail': initCourseDetail,
    'note': initNote, 'upload': initUpload, 'settings': initSettings
  };
  if (initMap[page]) initMap[page]();
  if (i18n._loaded) i18n.applyTranslations();
}

document.querySelectorAll('#sidebar .nav-item:not(.disabled)').forEach(function(el){
  el.addEventListener('click', function(){ navigateTo(this.dataset.page); });
});

// ── Language ──
async function switchLanguage(lang) {
  if (lang !== 'en' && lang !== 'zh') return;
  localStorage.setItem('language', lang);
  try { await eel.api_save_setting('language', lang)(); } catch(e) {}
  location.reload();
}

// ── Dashboard ──
function getGreeting() { var h = new Date().getHours(); if (h<12) return 'greeting_morning'; if (h<18) return 'greeting_afternoon'; return 'greeting_evening'; }
async function initDashboard() {
  var gw = i18n.t('dashboard.' + getGreeting());
  var ge = document.getElementById('dbGreeting'), st = document.getElementById('dbSubtitle');
  if (ge) { ge.textContent = i18n.t('dashboard.greeting_name', {greeting: gw}); ge.removeAttribute('data-i18n'); }
  try {
    var r = await eel.api_list_courses()();
    var rc = document.getElementById('recentCourses');
    if (r.success && r.courses.length > 0) {
      if (st) { st.textContent = i18n.t('dashboard.subtitle', {count: r.courses.length}); st.removeAttribute('data-i18n'); }
      var h = '';
      for (var i = 0; i < r.courses.length && i < 3; i++) { var c = r.courses[i]; h += '<div class="course-row" onclick="navigateTo(\'course-detail\',{courseId:'+c.id+'})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex-shrink:0"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>'+c.name+'</div>'; }
      rc.innerHTML = h;
    } else {
      if (st) { st.textContent = i18n.t('dashboard.subtitle_none'); st.removeAttribute('data-i18n'); }
      rc.innerHTML = '<div class="empty-block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><div class="eb-text">'+i18n.t('dashboard.empty.noCourses')+'</div></div>';
    }
  } catch(e) {}
  var ws = document.getElementById('weeklyStats');
  if (ws) ws.innerHTML = '<div class="empty-block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div class="eb-text">'+i18n.t('dashboard.stats_empty')+'</div></div>';
  var rn = document.getElementById('recentNotes');
  if (rn) rn.innerHTML = '<div class="empty-block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="eb-text">'+i18n.t('dashboard.empty.noNotes')+'</div></div>';
}

// ── Courses ──
async function initCourses() {
  try {
    var r = await eel.api_list_courses()();
    var grid = document.getElementById('coursesGrid'); if (!grid) return;
    if (r.success && r.courses.length > 0) {
      document.getElementById('coursesSubtitle').textContent = i18n.t('courses.subtitle_count', {count: r.courses.length});
      var h = '';
      for (var i = 0; i < r.courses.length; i++) { var c = r.courses[i]; h += '<div class="panel" style="cursor:pointer;transition:all var(--ease-normal)" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'var(--shadow-md)\'" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\'" onclick="navigateTo(\'course-detail\',{courseId:'+c.id+'})"><div style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--space-2);color:var(--text-primary)">'+c.name+'</div><div style="font-size:var(--text-sm);color:var(--text-tertiary)">'+i18n.t('courses.createdAt',{date:c.created_at})+'</div></div>'; }
      h += '<div class="panel" style="border:1.5px dashed rgba(255,255,255,0.10);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:100px;transition:all var(--ease-normal)" onmouseover="this.style.borderColor=\'var(--accent)\';this.style.background=\'var(--accent-muted)\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.10)\';this.style.background=\'transparent\'" onclick="showCreateCourse()"><div style="text-align:center;color:var(--text-tertiary)"><div style="font-size:24px;margin-bottom:4px">+</div><div style="font-size:var(--text-sm)">'+i18n.t('courses.addCourse')+'</div></div></div>';
      grid.innerHTML = h;
    }
  } catch(e) {}
}
function showCreateCourse() { var f = document.getElementById('createCourseForm'); if (f) { f.classList.remove('hidden'); setTimeout(function(){ var inp = document.getElementById('newCourseName'); if (inp) inp.focus(); }, 50); } }
function hideCreateCourse() { var f = document.getElementById('createCourseForm'); if (f) f.classList.add('hidden'); }
async function createCourse() { var inp = document.getElementById('newCourseName'); if (!inp || !inp.value.trim()) return; var r = await eel.api_create_course(inp.value.trim())(); if (r.success) { inp.value = ''; hideCreateCourse(); initCourses(); } else { alert(r.error); } }

// ── Course Detail ──
var _cdCourseId = null;
async function initCourseDetail() { _cdCourseId = _pageParams.courseId; if (!_cdCourseId) { navigateTo('courses'); return; } var cr = await eel.api_get_course(_cdCourseId)(); if (!cr.success) { navigateTo('courses'); return; } document.getElementById('cdCourseName').textContent = cr.course.name; document.getElementById('cdCourseMeta').textContent = i18n.t('courseDetail.detail'); await loadLectures(); }
async function loadLectures() {
  var ct = document.getElementById('tab-lectures'); if (!ct) return;
  var lr = await eel.api_get_lectures(_cdCourseId)();
  if (!lr.success || !lr.lectures || lr.lectures.length === 0) { ct.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><div class="es-title">'+i18n.t('courseDetail.empty.title')+'</div><div class="es-desc">'+i18n.t('courseDetail.empty.desc')+'</div><button class="btn" style="width:auto;padding:0 24px" onclick="navigateTo(\'upload\')">'+i18n.t('courseDetail.empty.action')+'</button></div>'; return; }
  var h = '';
  for (var i = 0; i < lr.lectures.length; i++) { var l = lr.lectures[i]; var badge = l.has_note ? '<span class="lc-badge lc-badge-has-note">'+i18n.t('courseDetail.badge.hasNote')+'</span>' : '<span class="lc-badge lc-badge-no-note">'+i18n.t('courseDetail.badge.noNote')+'</span>'; h += '<div class="lecture-card" onclick="navigateTo(\'note\',{lectureId:'+l.id+'})"><div class="lc-header"><span class="lc-title">'+l.title+'</span>'+badge+'</div><div class="lc-meta">'+l.created_at+'</div></div>'; }
  ct.innerHTML = h;
  document.getElementById('cdCourseMeta').textContent = i18n.t('courseDetail.lectureCount', {count: lr.lectures.length});
}
function switchTab(tab) { document.querySelectorAll('.tab-item').forEach(function(t){ t.classList.remove('active'); }); var ti = document.querySelector('.tab-item[data-tab="'+tab+'"]'); if (ti) ti.classList.add('active'); var tl = document.getElementById('tab-lectures'), tf = document.getElementById('tab-files'), ta = document.getElementById('tab-ai'); if (tl) tl.classList.toggle('hidden', tab !== 'lectures'); if (tf) tf.classList.toggle('hidden', tab !== 'files'); if (ta) ta.classList.toggle('hidden', tab !== 'ai'); }

// ── Note ──
var _noteText = '';
async function initNote() { var lid = _pageParams.lectureId; if (!lid) { navigateTo('courses'); return; } var r = await eel.api_get_lecture(lid)(); if (!r.success) { navigateTo('courses'); return; } var lec = r.lecture; document.getElementById('noteTitle').textContent = lec.title; document.getElementById('noteMeta').textContent = lec.created_at; document.getElementById('noteBackLink').onclick = function(){ navigateTo('course-detail',{courseId:lec.course_id}); }; if (!lec.note) { document.getElementById('noteContent').innerHTML = '<div class="empty-state"><div class="es-title">'+i18n.t('note.empty.title')+'</div><div class="es-desc">'+i18n.t('note.empty.desc')+'</div></div>'; document.getElementById('transcriptBody').classList.remove('hidden'); document.getElementById('transcriptBody').textContent = lec.transcript || ''; return; } _noteText = lec.note; document.getElementById('noteContent').innerHTML = parseNoteToHTML(lec.note); if (lec.transcript) document.getElementById('transcriptBody').textContent = lec.transcript; }
function parseNoteToHTML(md) { var sects = [], cur = {title:'',lines:[]}; var lines = md.split('\n'); for (var i = 0; i < lines.length; i++) { var line = lines[i]; if (/^##\s/.test(line)) { if (cur.title||cur.lines.length>0) sects.push(cur); cur = {title:line.replace(/^##\s+/,'').trim(),lines:[]}; } else if (/^#\s/.test(line)) { if (cur.title||cur.lines.length>0) sects.push(cur); cur = {title:'',lines:[line]}; } else { cur.lines.push(line); } } if (cur.title||cur.lines.length>0) sects.push(cur); var html = ''; for (var s = 0; s < sects.length; s++) { var sec = sects[s], t = sec.title.toLowerCase(), b = sec.lines.filter(function(l){return l.trim()!=='';}); function kw(m){return t.indexOf(m)>=0;} if (kw('主题')||kw('topic')||kw('summary')||kw('总结')||kw('概括')) { html += '<div class="note-section"><div class="note-section-title">'+i18n.t('note.sections.summary')+'</div><div class="note-summary">'+b.join('<br>')+'</div></div>'; } else if (kw('知识点')||kw('knowledge')||kw('要点')) { html += '<div class="note-section"><div class="note-section-title">'+i18n.t('note.sections.keyConcepts')+'</div>'; for (var j = 0; j < b.length; j++) { var cl = b[j].replace(/^[-•*]\s*/,''); if (cl.trim()) html += '<div class="note-concept-item"><span class="nci-dot">&bull;</span><span>'+cl+'</span></div>'; } html += '</div>'; } else if (kw('公式')||kw('equation')||kw('formula')) { html += '<div class="note-section"><div class="note-section-title">'+i18n.t('note.sections.equations')+'</div>'; for (var j = 0; j < b.length; j++) { if (/^[-•*]\s*/.test(b[j])) html += '<div class="equation-block">'+b[j].replace(/^[-•*]\s*/,'')+'</div>'; else if (b[j].trim()) html += '<div class="equation-desc">'+b[j]+'</div>'; } html += '</div>'; } else if (kw('概念')||kw('concept')||kw('术语')||kw('term')) { html += '<div class="note-section"><div class="note-section-title">'+sec.title+'</div><table class="term-table">'; for (var j = 0; j < b.length; j++) { var pts = b[j].split(/[:：]/,2); if (pts.length===2) html += '<tr><td>'+pts[0].replace(/^[-•*]\s*/,'').trim()+'</td><td>'+pts[1].trim()+'</td></tr>'; else if (b[j].trim()) html += '<tr><td colspan="2">'+b[j].replace(/^[-•*]\s*/,'')+'</td></tr>'; } html += '</table></div>'; } else if (kw('考试')||kw('exam')||kw('重点')||kw('focus')) { html += '<div class="note-section"><div class="note-section-title">'+i18n.t('note.sections.examFocus')+'</div>'; for (var j = 0; j < b.length; j++) { var cl = b[j].replace(/^[-•*]\s*/,''); if (!cl.trim()) continue; var ic = '📌'; if (cl.indexOf('必考')>=0||cl.indexOf('⭐')>=0) ic='⭐'; if (cl.indexOf('易错')>=0||cl.indexOf('⚠')>=0) ic='⚠️'; html += '<div class="exam-item"><span class="ei-icon">'+ic+'</span><span>'+cl+'</span></div>'; } html += '</div>'; } else if (t===''&&b.length>0&&b[0].startsWith('# ')) { html += '<div style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--space-4);color:var(--text-primary)">'+b[0].replace(/^#\s+/,'')+'</div>'; } else if (b.length>0) { html += '<div class="note-section"><div class="note-section-title">'+(sec.title||i18n.t('note.sections.notes'))+'</div><div style="line-height:var(--leading-relaxed);color:var(--text-secondary)">'+b.join('<br>')+'</div></div>'; } } return html || '<div style="line-height:var(--leading-relaxed);color:var(--text-secondary)">'+md.replace(/\n/g,'<br>')+'</div>'; }
function toggleTranscript() { var b = document.getElementById('transcriptBody'), ic = document.getElementById('transcriptToggleIcon'); if (!b||!ic) return; b.classList.toggle('hidden'); ic.textContent = b.classList.contains('hidden')?'▸':'▾'; }
async function copyNote() { if (_noteText) { await navigator.clipboard.writeText(_noteText); var btn = document.querySelector('.action-bar .btn-secondary'); if (btn) { var o = btn.textContent; btn.textContent = i18n.t('note.copied'); btn.style.color='var(--green)'; setTimeout(function(){ btn.textContent=o; btn.style.color=''; },1500); } } }
function exportNote() { if (!_noteText) return; var b = new Blob([_noteText],{type:'text/markdown'}); var u = URL.createObjectURL(b); var a = document.createElement('a'); a.href=u; a.download='note_'+new Date().toISOString().slice(0,10)+'.md'; a.click(); URL.revokeObjectURL(u); }

// ── Upload ──
var _selectedFilePath = null;
async function initUpload() { _selectedFilePath = null; document.getElementById('uploadZone').classList.remove('hidden'); document.getElementById('fileInfo').classList.add('hidden'); var btn = document.getElementById('startBtn'); if (btn) { btn.disabled = true; btn.textContent = i18n.t('upload.btnStartDisabled'); } var ps = document.getElementById('progressSection'); if (ps) { ps.classList.add('hidden'); var nb = ps.querySelector('.note-box'); if (nb) nb.remove(); } var r = await eel.api_list_courses()(); var s = document.getElementById('courseSelect'); if (!s) return; if (r.courses.length === 0) { s.innerHTML = '<option value="">'+i18n.t('upload.selectNoCourses')+'</option>'; return; } var h = '<option value="">'+i18n.t('upload.selectPlaceholder')+'</option>'; for (var i = 0; i < r.courses.length; i++) h += '<option value="'+r.courses[i].id+'">'+r.courses[i].name+'</option>'; s.innerHTML = h; s.onchange = checkUploadReady; }
function checkUploadReady() { var cid = document.getElementById('courseSelect') ? document.getElementById('courseSelect').value : ''; var btn = document.getElementById('startBtn'); if (!btn) return; if (cid && _selectedFilePath) { btn.disabled = false; btn.textContent = i18n.t('upload.btnStart'); } else { btn.disabled = true; btn.textContent = i18n.t('upload.btnStartDisabled'); } }
async function selectAudioFile() { var r = await eel.api_select_audio_file()(); if (!r.success) return; _selectedFilePath = r.path; document.getElementById('uploadZone').classList.add('hidden'); document.getElementById('fileInfo').classList.remove('hidden'); document.getElementById('fileName').textContent = r.info.filename; document.getElementById('fileMeta').textContent = r.info.size_mb + ' MB · ' + r.info.format; checkUploadReady(); }
function removeFile() { _selectedFilePath = null; document.getElementById('uploadZone').classList.remove('hidden'); document.getElementById('fileInfo').classList.add('hidden'); checkUploadReady(); }
async function startProcess() { var cid = parseInt(document.getElementById('courseSelect').value); if (!cid || !_selectedFilePath) return; var btn = document.getElementById('startBtn'); if (btn) { btn.disabled = true; btn.textContent = i18n.t('upload.btnProcessing'); } var ps = document.getElementById('progressSection'); if (ps) ps.classList.remove('hidden'); var copyResult = await eel.api_copy_audio(_selectedFilePath, cid)(); var ts = document.getElementById('stepTranscribe'); if (ts) ts.innerHTML = '<span class="ps-icon ps-active">&bull;</span> <span>'+i18n.t('upload.progress.transcribingActive')+'</span>'; var fill = document.getElementById('progressFill'); if (fill) fill.style.width = '30%'; var tr = await eel.api_transcribe_audio(copyResult.path, cid)(); if (!tr.success) { if (ts) ts.innerHTML = '<span class="ps-icon" style="color:var(--red)">&bull;</span> '+i18n.t('upload.progress.transcribingFailed')+'：'+tr.error; if (btn) { btn.textContent = i18n.t('upload.btnFailed'); btn.disabled = false; } return; } if (ts) ts.innerHTML = '<span class="ps-icon ps-done">&bull;</span> <span>'+i18n.t('upload.progress.transcribingDone')+'</span>'; if (fill) fill.style.width = '65%'; var lid = tr.lecture_id; var ns = document.getElementById('stepNote'); if (ns) ns.innerHTML = '<span class="ps-icon ps-active">&bull;</span> <span>'+i18n.t('upload.progress.generatingActive')+'</span>'; var nr = await eel.api_generate_note(lid)(); if (!nr.success) { if (ns) ns.innerHTML = '<span class="ps-icon" style="color:var(--red)">&bull;</span> '+i18n.t('upload.progress.generatingFailed')+'：'+nr.error; if (btn) { btn.textContent = i18n.t('upload.btnFailed'); btn.disabled = false; } return; } if (ns) ns.innerHTML = '<span class="ps-icon ps-done">&bull;</span> <span>'+i18n.t('upload.progress.generatingDone')+'</span>'; if (fill) fill.style.width = '100%'; if (btn) btn.textContent = i18n.t('upload.btnDone'); if (ps) { var ob = ps.querySelector('.note-box'); if (ob) ob.remove(); ps.insertAdjacentHTML('beforeend', '<div class="note-box"><h3>'+i18n.t('upload.noteBoxTitle')+'</h3><div>'+nr.note.replace(/\n/g,'<br>')+'</div><button class="btn-secondary" style="margin-top:12px" onclick="navigateTo(\'note\',{lectureId:'+lid+'})">'+i18n.t('upload.viewFullNote')+'</button></div>'); } _selectedFilePath = null; document.getElementById('uploadZone').classList.remove('hidden'); document.getElementById('fileInfo').classList.add('hidden'); if (btn) { btn.disabled = true; btn.textContent = i18n.t('upload.btnStartDisabled'); } }

// ── Settings ──
async function initSettings() { var k = await eel.api_get_setting('deepseek_key')(); var el = document.getElementById('deepseekKey'); if (el && k) el.value = k; var ls = document.getElementById('languageSelect'); if (ls) ls.value = i18n.getLanguage(); }
async function testDeepseek() { var k = document.getElementById('deepseekKey') ? document.getElementById('deepseekKey').value.trim() : ''; if (!k) return; var el = document.getElementById('deepseekStatus'); if (!el) return; el.textContent = i18n.t('settings.testing'); el.className = 'status-msg'; var r = await eel.api_test_key('deepseek', k)(); if (r.success) { el.textContent = i18n.t('settings.testSuccess'); el.className = 'status-msg ok'; } else { el.textContent = i18n.t('settings.testFailed'); el.className = 'status-msg fail'; } }
async function saveSettings() { var k = document.getElementById('deepseekKey') ? document.getElementById('deepseekKey').value.trim() : ''; if (k) await eel.api_save_setting('deepseek_key', k)(); var el = document.getElementById('saveStatus'); if (el) { el.textContent = i18n.t('settings.saved'); el.className = 'status-msg ok'; } var btn = document.querySelector('.btn-save'); if (btn) { var o = btn.textContent; btn.textContent = i18n.t('settings.saved'); btn.style.background = 'var(--green)'; setTimeout(function(){ btn.textContent = o; btn.style.background = ''; }, 1500); } }

// ── Boot ──
(async function boot() { await i18n.init(); navigateTo('dashboard'); })();
</script>
