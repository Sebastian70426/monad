<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情 - AI学习助手</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1a1a2e; color: #eee;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            height: 100vh; display: flex;
        }
        .sidebar {
            width: 220px; background: #16213e; padding: 24px 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .sidebar .logo {
            font-size: 20px; font-weight: bold; margin-bottom: 24px; color: #fff; cursor: pointer;
        }
        .sidebar .nav-item {
            padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #aaa; font-size: 15px;
        }
        .sidebar .nav-item:hover, .sidebar .nav-item.active {
            background: #0f3460; color: #fff;
        }
        .main { flex: 1; padding: 32px; overflow-y: auto; }
        .main .back { color: #888; cursor: pointer; font-size: 14px; margin-bottom: 8px; }
        .main .back:hover { color: #fff; }
        .main h2 { font-size: 24px; margin-bottom: 24px; color: #fff; }

        .lecture-list { display: flex; flex-direction: column; gap: 12px; }
        .lecture-card {
            background: #16213e; border-radius: 8px; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        .lecture-card:hover { background: #1e2d4a; }
        .lecture-card .info .title { font-size: 16px; color: #fff; }
        .lecture-card .info .meta { font-size: 13px; color: #888; margin-top: 4px; }
        .lecture-card .badge {
            padding: 4px 10px; border-radius: 12px; font-size: 12px;
        }
        .lecture-card .badge.has-note { background: #27ae60; color: #fff; }
        .lecture-card .badge.no-note { background: #555; color: #999; }
        .empty { color: #666; text-align: center; margin-top: 60px; font-size: 15px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo" onclick="window.location.href='index.html'">🎓 AI学习助手</div>
    <div class="nav-item" onclick="window.location.href='index.html'">📚 我的课程</div>
    <div class="nav-item" onclick="window.location.href='upload.html'">🎤 新录音</div>
    <div class="nav-item" onclick="window.location.href='settings.html'">⚙️ 设置</div>
</div>

<div class="main">
    <div class="back" onclick="window.location.href='index.html'">← 返回课程列表</div>
    <h2 id="courseTitle">加载中...</h2>

    <div class="lecture-list" id="lectureList"></div>
</div>

<script>
async function init() {
    let params = new URLSearchParams(window.location.search);
    let courseId = params.get('course_id');
    if (!courseId) {
        window.location.href = 'index.html';
        return;
    }

    // 加载课程信息
    let courseResult = await eel.api_get_course(parseInt(courseId))();
    if (courseResult.success) {
        document.getElementById('courseTitle').textContent = '📖 ' + courseResult.course.name;
        document.title = courseResult.course.name + ' - AI学习助手';
    }

    // 加载课堂记录列表
    let lecturesResult = await eel.api_get_lectures(parseInt(courseId))();
    let container = document.getElementById('lectureList');

    if (!lecturesResult.lectures || lecturesResult.lectures.length === 0) {
        container.innerHTML = '<div class="empty">还没有课堂记录<br><br>点左侧 🎤 新录音 开始分析第一节课</div>';
        return;
    }

    let html = '';
    for (let l of lecturesResult.lectures) {
        let badge = l.has_note
            ? '<span class="badge has-note">已有笔记</span>'
            : '<span class="badge no-note">转录完成</span>';
        html += `
            <div class="lecture-card" onclick="window.location.href='note.html?lecture_id=${l.id}'">
                <div class="info">
                    <div class="title">📝 ${l.title}</div>
                    <div class="meta">${l.created_at}</div>
                </div>
                ${badge}
            </div>`;
    }
    container.innerHTML = html;
}

init();
</script>

</body>
</html>
