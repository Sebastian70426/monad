<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>录音分析 - AI 学习助手</title>
<script src="/eel.js"></script>
<link rel="stylesheet" href="css/design-system.css">
<style>
body{display:flex;flex-direction:column;height:100vh}
#titlebar{height:var(--titlebar-h);flex-shrink:0;background:#0F0F0F;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;-webkit-app-region:drag}
#titlebar span{font-size:var(--text-sm);font-weight:var(--font-medium);color:var(--text-secondary);letter-spacing:0.2px}
#body-wrap{display:flex;flex:1;overflow:hidden}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--space-3)}
#sidebar .logo{font-size:var(--text-sm);font-weight:var(--font-semibold);color:var(--text-primary);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);letter-spacing:-0.2px;cursor:pointer}
#sidebar .sec-label{font-size:var(--text-xs);font-weight:var(--font-medium);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.6px;padding:var(--space-3) var(--space-3) var(--space-1)}
#sidebar .nav-item{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);height:34px;border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--text-secondary);cursor:pointer;transition:all var(--ease-fast)}
#sidebar .nav-item:hover{background:var(--bg-card);color:var(--text-primary)}
#sidebar .nav-item.active{background:var(--bg-card);color:var(--text-primary);font-weight:var(--font-medium);box-shadow:inset 2px 0 0 var(--accent)}
#sidebar .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.55}
#sidebar .nav-item:hover svg{opacity:0.85}
#sidebar .nav-item.active svg{opacity:1;color:var(--accent)}
#sidebar .user{margin-top:auto;padding:var(--space-3);font-size:var(--text-sm);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-2)}
#sidebar .user .avatar{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:11px}
#content{flex:1;background:var(--bg-content);padding:var(--space-8);overflow-y:auto}
#statusbar{height:var(--statusbar-h);flex-shrink:0;background:#0F0F0F;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-5);font-size:var(--text-xs);color:var(--text-tertiary)}
#statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

.page-title{font-size:var(--text-2xl);font-weight:var(--font-bold);letter-spacing:-0.4px;margin-bottom:var(--space-8)}
.step-label{font-size:var(--text-sm);font-weight:var(--font-medium);color:var(--text-secondary);margin-bottom:var(--space-1)}
select{width:100%;height:36px;padding:0 var(--space-3);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);outline:none;cursor:pointer;margin-bottom:var(--space-6);appearance:none}
select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,0.15)}

.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-xl);padding:48px;text-align:center;cursor:pointer;transition:all var(--ease-normal);margin-bottom:var(--space-6)}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-muted)}
.upload-zone svg{width:32px;height:32px;margin-bottom:var(--space-3);opacity:0.5}
.upload-zone .uz-text{font-size:var(--text-base);color:var(--text-secondary);font-weight:var(--font-medium)}
.upload-zone .uz-hint{font-size:var(--text-sm);color:var(--text-tertiary);margin-top:var(--space-1)}

.file-info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--space-4);margin-bottom:var(--space-6);display:flex;justify-content:space-between;align-items:center}
.file-info-card .fi-name{font-size:var(--text-base);font-weight:var(--font-medium)}
.file-info-card .fi-meta{font-size:var(--text-sm);color:var(--text-secondary);margin-top:2px}
.file-info-card .fi-remove{font-size:var(--text-sm);color:var(--text-tertiary);cursor:pointer;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);transition:all var(--ease-fast)}
.file-info-card .fi-remove:hover{color:var(--red);background:rgba(248,113,113,0.1)}

.btn{width:100%;height:40px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:var(--font-semibold);cursor:pointer;transition:all var(--ease-fast)}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(0.985)}
.btn:disabled{opacity:0.35;cursor:not-allowed}

.progress-section{margin-top:var(--space-6)}
.progress-bar{height:5px;background:var(--bg-input);border-radius:3px;margin-bottom:var(--space-4);overflow:hidden}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width var(--ease-normal)}
.progress-step{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;font-size:var(--text-sm)}
.progress-step .ps-icon{width:18px;text-align:center;flex-shrink:0}
.ps-done{color:var(--green)}.ps-active{color:var(--accent)}.ps-wait{color:var(--text-tertiary)}
.note-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--space-5);margin-top:var(--space-6);line-height:var(--leading-base)}
.note-box h3{font-size:var(--text-base);font-weight:var(--font-semibold);margin-bottom:var(--space-4)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="titlebar"><span>AI 学习助手</span></div>

<div id="body-wrap">
<div id="sidebar">
  <div class="logo" onclick="window.location.href='index.html'">AIStudyBuddy</div>
  <div class="sec-label">学习</div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard
  </div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg> 课程
  </div>
  <div class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 录音分析
  </div>
  <div class="sec-label">智能</div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> AI Tutor
  </div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> 知识库
  </div>
  <div class="sec-label">系统</div>
  <div class="nav-item" onclick="window.location.href='settings.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg> 设置
  </div>
  <div class="user"><div class="avatar">S</div>Sebastian</div>
</div>

<div id="content">
  <div class="page-title">录音分析</div>

  <div class="step-label">选择课程</div>
  <select id="courseSelect"><option value="">-- 请先创建课程 --</option></select>

  <div class="step-label">选择录音文件</div>
  <div class="upload-zone" id="uploadZone" onclick="selectAudioFile()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <div class="uz-text">点击选择音频文件</div>
    <div class="uz-hint">MP3 / M4A / WAV / FLAC &middot; 最大 200MB</div>
  </div>

  <div class="file-info-card hidden" id="fileInfo">
    <div><div class="fi-name" id="fileName"></div><div class="fi-meta" id="fileMeta"></div></div>
    <span class="fi-remove" onclick="removeFile()">移除</span>
  </div>

  <button class="btn" id="startBtn" disabled onclick="startProcess()">选择课程和文件后开始</button>

  <div class="progress-section hidden" id="progressSection">
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-step" id="stepTranscribe"><span class="ps-icon ps-wait">&#9679;</span> 语音转文字</div>
    <div class="progress-step" id="stepNote"><span class="ps-icon ps-wait">&#9679;</span> 生成课堂笔记</div>
  </div>
</div>
</div>

<div id="statusbar"><span style="display:flex;align-items:center;gap:6px"><span class="dot"></span>模型就绪</span><span>DeepSeek V4</span></div>

<script>
let selectedFilePath=null;
(async function init(){
  let r=await eel.api_list_courses()();
  let s=document.getElementById('courseSelect');
  if(r.courses.length===0){s.innerHTML='<option value="">-- 请先在 Dashboard 创建课程 --</option>';return}
  let h='<option value="">-- 选择课程 --</option>';
  for(let c of r.courses)h+=`<option value="${c.id}">${c.name}</option>`;
  s.innerHTML=h;
})();
document.getElementById('courseSelect').addEventListener('change',checkReady);
function checkReady(){
  let cid=document.getElementById('courseSelect').value;
  let b=document.getElementById('startBtn');
  if(cid&&selectedFilePath){b.disabled=false;b.textContent='开始分析'}else{b.disabled=true;b.textContent='选择课程和文件后开始'}
}
async function selectAudioFile(){
  let r=await eel.api_select_audio_file()();if(!r.success)return;
  selectedFilePath=r.path;document.getElementById('uploadZone').classList.add('hidden');
  document.getElementById('fileInfo').classList.remove('hidden');
  document.getElementById('fileName').textContent=r.info.filename;
  document.getElementById('fileMeta').textContent=r.info.size_mb+' MB \xB7 '+r.info.format;
  checkReady();
}
function removeFile(){selectedFilePath=null;document.getElementById('uploadZone').classList.remove('hidden');document.getElementById('fileInfo').classList.add('hidden');checkReady()}
async function startProcess(){
  let courseId=parseInt(document.getElementById('courseSelect').value);
  if(!courseId||!selectedFilePath)return;
  let b=document.getElementById('startBtn');b.disabled=true;b.textContent='处理中...';
  let ps=document.getElementById('progressSection');ps.classList.remove('hidden');
  let copyResult=await eel.api_copy_audio(selectedFilePath,courseId)();
  let audioPath=copyResult.path;
  let ts=document.getElementById('stepTranscribe');
  ts.innerHTML='<span class="ps-icon ps-active">&#9679;</span> 语音转文字中...';
  document.getElementById('progressFill').style.width='30%';
  let tr=await eel.api_transcribe_audio(audioPath,courseId)();
  if(!tr.success){ts.innerHTML='<span class="ps-icon" style="color:var(--red)">&#9679;</span> 转录失败：'+tr.error;b.textContent='分析失败';b.disabled=false;return}
  ts.innerHTML='<span class="ps-icon ps-done">&#9679;</span> 语音转文字完成';
  document.getElementById('progressFill').style.width='65%';
  let lectureId=tr.lecture_id;
  let ns=document.getElementById('stepNote');
  ns.innerHTML='<span class="ps-icon ps-active">&#9679;</span> 生成课堂笔记中...';
  let nr=await eel.api_generate_note(lectureId)();
  if(!nr.success){ns.innerHTML='<span class="ps-icon" style="color:var(--red)">&#9679;</span> 笔记生成失败：'+nr.error;b.textContent='分析失败';b.disabled=false;return}
  ns.innerHTML='<span class="ps-icon ps-done">&#9679;</span> 课堂笔记生成完成';
  document.getElementById('progressFill').style.width='100%';
  b.textContent='分析完成';
  ps.innerHTML+=`<div class="note-box"><h3>课堂笔记</h3><div>${nr.note.replace(/\n/g,'<br>')}</div></div>`;
  selectedFilePath=null;document.getElementById('uploadZone').classList.remove('hidden');
  document.getElementById('fileInfo').classList.add('hidden');b.disabled=true;b.textContent='选择课程和文件后开始';
}
</script>
</body>
</html>
