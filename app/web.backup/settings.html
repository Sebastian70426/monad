<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>设置 - AI 学习助手</title>
<script src="/eel.js"></script>
<link rel="stylesheet" href="css/design-system.css">
<style>
body{display:flex;flex-direction:column;height:100vh}
#titlebar{height:var(--titlebar-h);flex-shrink:0;background:#0F0F0F;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;-webkit-app-region:drag}
#titlebar span{font-size:var(--text-sm);font-weight:var(--font-medium);color:var(--text-secondary);letter-spacing:0.2px}
#body-wrap{display:flex;flex:1;overflow:hidden}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--space-3)}
#sidebar .logo{font-size:var(--text-sm);font-weight:var(--font-semibold);color:var(--text-primary);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);letter-spacing:-0.2px;cursor:pointer}
#sidebar .sec-label{font-size:var(--text-xs);font-weight:var(--font-medium);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.6px;padding:var(--space-3) var(--space-3) var(--space-1)}
#sidebar .nav-item{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);height:34px;border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:var(--font-regular);color:var(--text-secondary);cursor:pointer;transition:all var(--ease-fast)}
#sidebar .nav-item:hover{background:var(--bg-card);color:var(--text-primary)}
#sidebar .nav-item.active{background:var(--bg-card);color:var(--text-primary);font-weight:var(--font-medium);box-shadow:inset 2px 0 0 var(--accent)}
#sidebar .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.55}
#sidebar .nav-item:hover svg{opacity:0.85}
#sidebar .nav-item.active svg{opacity:1;color:var(--accent)}
#sidebar .user{margin-top:auto;padding:var(--space-3);font-size:var(--text-sm);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-2)}
#sidebar .user .avatar{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:11px}
#content{flex:1;background:var(--bg-content);padding:var(--space-8);overflow-y:auto}
#statusbar{height:var(--statusbar-h);flex-shrink:0;background:#0F0F0F;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-5);font-size:var(--text-xs);color:var(--text-tertiary)}
#statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

.page-title{font-size:var(--text-2xl);font-weight:var(--font-bold);letter-spacing:-0.4px;margin-bottom:var(--space-8)}
.setting-group{margin-bottom:var(--space-6)}
.setting-group label{display:block;font-size:var(--text-sm);font-weight:var(--font-medium);color:var(--text-secondary);margin-bottom:var(--space-2)}
.input-row{display:flex;gap:var(--space-2)}
.input-row input{flex:1;height:36px;padding:0 var(--space-3);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);outline:none}
.input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,0.15)}
.btn-test{height:36px;padding:0 var(--space-4);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer;transition:all var(--ease-fast)}
.btn-test:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.btn-save{width:100%;height:40px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:var(--font-semibold);cursor:pointer;transition:all var(--ease-fast);margin-top:var(--space-4)}
.btn-save:hover{background:var(--accent-hover)}
.btn-save:active{transform:scale(0.985)}
.status-msg{font-size:var(--text-sm);margin-top:var(--space-1)}
.status-msg.ok{color:var(--green)}.status-msg.fail{color:var(--red)}
</style>
</head>
<body>
<div id="titlebar"><span>AI 学习助手</span></div>
<div id="body-wrap">
<div id="sidebar">
  <div class="logo" onclick="window.location.href='index.html'">AIStudyBuddy</div>
  <div class="sec-label">学习</div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard
  </div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg> 课程
  </div>
  <div class="nav-item" onclick="window.location.href='upload.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 录音分析
  </div>
  <div class="sec-label">智能</div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> AI Tutor
  </div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> 知识库
  </div>
  <div class="sec-label">系统</div>
  <div class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg> 设置
  </div>
  <div class="user"><div class="avatar">S</div>Sebastian</div>
</div>

<div id="content">
  <div class="page-title">设置</div>
  <div class="setting-group">
    <label>DeepSeek API Key</label>
    <div class="input-row">
      <input type="password" id="deepseekKey" placeholder="sk-..."/>
      <button class="btn-test" onclick="testDeepseek()">测试</button>
    </div>
    <div class="status-msg" id="deepseekStatus"></div>
  </div>
  <button class="btn-save" onclick="saveSettings()">保存设置</button>
  <div class="status-msg" id="saveStatus" style="margin-top:var(--space-2)"></div>
</div>
</div>
<div id="statusbar"><span style="display:flex;align-items:center;gap:6px"><span class="dot"></span>模型就绪</span><span>DeepSeek V4</span></div>
<script>
(async function init(){let k=await eel.api_get_setting('deepseek_key')();if(k)document.getElementById('deepseekKey').value=k})();
async function testDeepseek(){let k=document.getElementById('deepseekKey').value.trim();if(!k)return;let el=document.getElementById('deepseekStatus');el.textContent='测试中...';el.className='status-msg';let r=await eel.api_test_key('deepseek',k)();if(r.success){el.textContent='连接成功';el.className='status-msg ok'}else{el.textContent=r.error;el.className='status-msg fail'}}
async function saveSettings(){let k=document.getElementById('deepseekKey').value.trim();await eel.api_save_setting('deepseek_key',k)();let el=document.getElementById('saveStatus');el.textContent='已保存';el.className='status-msg ok'}
</script>
</body>
</html>
