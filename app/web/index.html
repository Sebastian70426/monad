<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Monad — AI 学习伙伴</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ═══ 启动动画 ═══ -->
<div id="splash" class="splash">
  <div class="splash-bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="splash-inner">
    <div class="logo-wrap"><span class="logo-ring"></span><span class="logo-core">M</span></div>
    <div class="splash-name">MONAD</div>
    <div class="splash-sub">Initializing AI Engine</div>
    <div class="splash-steps">
      <div class="s-step"><span class="s-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.4L19.5 10.5l-5.4 2.1L12 18l-2.1-5.4L4.5 10.5l5.4-2.1z"/></svg></span><span>AI Model</span><span class="s-check">✓</span></div>
      <div class="s-step"><span class="s-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h14"/></svg></span><span>Knowledge Base</span><span class="s-check">✓</span></div>
      <div class="s-step"><span class="s-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span>Learning Memory</span><span class="s-check">✓</span></div>
    </div>
    <div class="splash-welcome"><span class="w-spark">✦</span> Welcome back, Sebastian</div>
  </div>
</div>

<!-- ═══ 应用外壳：全局导航 + AI 副栏 + 主舞台 ═══ -->
<div class="app">
  <!-- 第一级：全局引导栏（图标+文字，220px，定海神针） -->
  <aside class="gnav" id="gnav"></aside>

  <!-- 第二级：AI 专属图标副栏（60px，仅 Tutor 页显示） -->
  <aside class="aisub" id="aisub"></aside>

  <!-- 主舞台：AI 聊天全屏沉浸 -->
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page" id="page"></div>
  </main>
</div>

<!-- ═══ Popover（悬浮面板，不挤压主界面） ═══ -->
<div id="popover" class="popover hidden"></div>

<!-- ═══ 命令中枢 Command Palette（居中毛玻璃） ═══ -->
<div id="cmdOverlay" class="cmd-overlay hidden">
  <div class="cmd-panel">
    <div class="cmd-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;opacity:0.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="cmdInput" placeholder="搜索历史对话、课程、知识库文件…" autofocus>
      <span class="cmd-kbd">ESC</span>
    </div>
    <div id="cmdList" class="cmd-list"></div>
  </div>
</div>

<script src="/eel.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/courses.js"></script>
<script src="js/pages/course.js"></script>
<script src="js/pages/tutor.js"></script>
<script src="js/pages/knowledge.js"></script>
<script src="js/pages/review.js"></script>
<script src="js/pages/settings.js"></script>
</body>
</html>
